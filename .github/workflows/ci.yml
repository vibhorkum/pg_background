name: CI - PostgreSQL Extension Build & Test

on:
  push:
    branches: [ master, main, develop, 'v1.*', 'improvements/*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Default PostgreSQL version for lint/security jobs
  DEFAULT_PG_VERSION: "17"

jobs:
  test:
    name: PG ${{ matrix.pg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        pg: [14, 15, 16, 17, 18]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            ~/apt-cache
          key: apt-${{ matrix.os }}-pg${{ matrix.pg }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ matrix.os }}-pg${{ matrix.pg }}-
            apt-${{ matrix.os }}-

      - name: Start PostgreSQL container
        run: |
          set -euo pipefail

          # Start PostgreSQL in a container
          docker run --name postgres-test -d \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:${{ matrix.pg }}

          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL to start..."
          for i in {1..30}; do
            if docker exec postgres-test pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              docker exec postgres-test psql -U postgres -c "SELECT version();"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::PostgreSQL failed to start within 60 seconds"
              exit 1
            fi
            echo "Still waiting... ($i/30)"
            sleep 2
          done

      - name: Install build dependencies
        run: |
          set -euo pipefail

          # Disable problematic Microsoft repositories (known to return 403 on GitHub runners)
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates \
            wget \
            gnupg \
            lsb-release \
            build-essential \
            libkrb5-dev

          # Add PGDG repo
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg

          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update -qq

          # Install client + server-dev headers for the target major
          sudo apt-get install -y -qq \
            postgresql-client-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }}

      - name: Setup clang/llvm symlinks
        run: |
          # Create symlinks for clang/llvm tools to avoid version mismatch errors
          # The PGXS build system may expect specific versions (e.g., clang-19, llvm-19)
          for target_ver in 19 18; do
            if [ ! -e "/usr/bin/clang-${target_ver}" ]; then
              sudo ln -sf /usr/bin/clang "/usr/bin/clang-${target_ver}" 2>/dev/null || true
            fi
            if [ ! -d "/usr/lib/llvm-${target_ver}" ]; then
              # Find the highest llvm version available
              LLVM_VER=$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -1 | sed 's|.*/llvm-||' || echo "")
              if [ -n "$LLVM_VER" ] && [ -d "/usr/lib/llvm-${LLVM_VER}" ]; then
                sudo mkdir -p "/usr/lib/llvm-${target_ver}/bin"
                if [ -f "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" ]; then
                  sudo ln -sf "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" "/usr/lib/llvm-${target_ver}/bin/llvm-lto" || true
                fi
              fi
            fi
          done

      - name: Build extension
        run: |
          set -euo pipefail

          export PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

          echo "=== Build Environment ==="
          $PG_CONFIG --version
          echo "========================="

          make clean
          make

          echo "=== Build artifacts ==="
          ls -la pg_background.so
          ls -la pg_background.control
          echo "======================="

      - name: Copy extension files into container
        run: |
          set -euo pipefail

          # Get PostgreSQL paths from pg_config
          PKGLIBDIR=$(/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config --pkglibdir)
          SHAREDIR=$(/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config --sharedir)

          echo "Container PostgreSQL paths:"
          echo "  PKGLIBDIR: $PKGLIBDIR"
          echo "  SHAREDIR: $SHAREDIR"

          # Copy the shared library
          docker exec postgres-test mkdir -p "$PKGLIBDIR"
          docker cp pg_background.so postgres-test:$PKGLIBDIR/pg_background.so

          # Copy extension control and SQL files
          docker exec postgres-test mkdir -p "$SHAREDIR/extension"
          docker cp pg_background.control postgres-test:$SHAREDIR/extension/

          # Copy all SQL files (base install and upgrade scripts)
          for sqlfile in pg_background--*.sql; do
            echo "Copying $sqlfile..."
            docker cp "$sqlfile" postgres-test:$SHAREDIR/extension/
          done

          # Optionally copy bitcode if it was built successfully
          if [ -f pg_background.bc ]; then
            echo "Copying bitcode file..."
            docker exec postgres-test mkdir -p "$PKGLIBDIR/bitcode/pg_background"
            docker cp pg_background.bc postgres-test:$PKGLIBDIR/bitcode/pg_background/ || echo "Warning: Failed to copy bitcode (non-critical)"
          fi

          echo "=== Verify installation in container ==="
          docker exec postgres-test ls -la "$PKGLIBDIR/pg_background.so"
          docker exec postgres-test ls -la "$SHAREDIR/extension/pg_background.control"

      - name: Run regression tests
        run: |
          set -euo pipefail

          export PGHOST=127.0.0.1
          export PGPORT=5432
          export PGUSER=postgres
          export PGPASSWORD=postgres
          export PGDATABASE=postgres
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"

          echo "=== Test Environment ==="
          psql -c "SELECT version();"
          psql -c "CREATE EXTENSION pg_background;"
          psql -c "SELECT * FROM pg_available_extensions WHERE name = 'pg_background';"
          echo "========================"

          # Run regression tests - tests connect to the containerized PostgreSQL
          export PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          make installcheck REGRESS_OPTS+=" --host=$PGHOST --port=$PGPORT --user=$PGUSER"

      - name: Show test results on failure
        if: failure()
        run: |
          echo "=== Regression Diffs ==="
          cat regression.diffs 2>/dev/null || echo "No diffs file"
          echo ""
          echo "=== Regression Out ==="
          cat regression.out 2>/dev/null || echo "No out file"
          echo ""
          echo "=== Container Logs ==="
          docker logs postgres-test 2>&1 | tail -100

      - name: Upload regression diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs-pg${{ matrix.pg }}-${{ matrix.os }}
          path: |
            regression.diffs
            regression.out
            results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker stop postgres-test 2>/dev/null || true
          docker rm postgres-test 2>/dev/null || true

  # Test extension relocatability (custom schema installation)
  relocatable-test:
    name: Relocatable Test (PG 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start PostgreSQL container
        run: |
          docker run --name postgres-relocatable -d \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:17

          for i in {1..30}; do
            if docker exec postgres-relocatable pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            [ "$i" -eq 30 ] && { echo "::error::PostgreSQL failed to start"; exit 1; }
            sleep 2
          done

      - name: Install build dependencies
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq ca-certificates wget gnupg lsb-release build-essential libkrb5-dev
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17 postgresql-server-dev-17

      - name: Setup clang/llvm symlinks
        run: |
          for target_ver in 19 18; do
            [ ! -e "/usr/bin/clang-${target_ver}" ] && sudo ln -sf /usr/bin/clang "/usr/bin/clang-${target_ver}" 2>/dev/null || true
            if [ ! -d "/usr/lib/llvm-${target_ver}" ]; then
              LLVM_VER=$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -1 | sed 's|.*/llvm-||' || echo "")
              if [ -n "$LLVM_VER" ] && [ -d "/usr/lib/llvm-${LLVM_VER}" ]; then
                sudo mkdir -p "/usr/lib/llvm-${target_ver}/bin"
                [ -f "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" ] && sudo ln -sf "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" "/usr/lib/llvm-${target_ver}/bin/llvm-lto" || true
              fi
            fi
          done

      - name: Build and install extension
        run: |
          export PG_CONFIG=/usr/lib/postgresql/17/bin/pg_config
          make clean && make
          PKGLIBDIR=$($PG_CONFIG --pkglibdir)
          SHAREDIR=$($PG_CONFIG --sharedir)
          docker exec postgres-relocatable mkdir -p "$PKGLIBDIR" "$SHAREDIR/extension"
          docker cp pg_background.so postgres-relocatable:$PKGLIBDIR/
          docker cp pg_background.control postgres-relocatable:$SHAREDIR/extension/
          for sqlfile in pg_background--*.sql; do
            docker cp "$sqlfile" postgres-relocatable:$SHAREDIR/extension/
          done

      - name: Run relocatable tests
        run: |
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGPASSWORD=postgres PGDATABASE=postgres
          psql <<'EOF'
          -- Create custom schema and install extension there
          CREATE SCHEMA bgwork;
          CREATE EXTENSION pg_background SCHEMA bgwork;

          -- Verify extension is in custom schema
          SELECT extnamespace::regnamespace AS schema FROM pg_extension WHERE extname = 'pg_background';

          -- Test basic functionality in custom schema
          DO $$
          DECLARE
              h bgwork.pg_background_handle;
          BEGIN
              SELECT * INTO h FROM bgwork.pg_background_launch_v2('SELECT 1', 65536);
              PERFORM bgwork.pg_background_wait_v2(h.pid, h.cookie);
              PERFORM bgwork.pg_background_detach_v2(h.pid, h.cookie);
              RAISE NOTICE 'PASS: Relocatable extension works in custom schema';
          END;
          $$;

          -- Verify types are in custom schema
          SELECT typname, typnamespace::regnamespace AS schema
          FROM pg_type
          WHERE typname LIKE 'pg_background_%' AND typnamespace = 'bgwork'::regnamespace
          ORDER BY typname;

          -- Test role and privilege helpers work
          SELECT bgwork.grant_pg_background_privileges(current_user);
          SELECT bgwork.revoke_pg_background_privileges(current_user);

          -- Final check
          SELECT CASE WHEN count(*) > 0 THEN 'PASS: Relocatable test complete'
                      ELSE 'FAIL: No functions found' END
          FROM pg_proc WHERE pronamespace = 'bgwork'::regnamespace;
          EOF

      - name: Cleanup
        if: always()
        run: docker stop postgres-relocatable 2>/dev/null || true; docker rm postgres-relocatable 2>/dev/null || true

  # Test upgrade path from 1.8 to 1.9
  upgrade-test:
    name: Upgrade Test (1.8 → 1.9)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run upgrade test
        run: ./test-upgrade.sh 17

  # Summary job that depends on all test matrix jobs
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, relocatable-test, upgrade-test]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Main test matrix failed"
            exit 1
          fi
          if [ "${{ needs.relocatable-test.result }}" != "success" ]; then
            echo "::error::Relocatable test failed"
            exit 1
          fi
          if [ "${{ needs.upgrade-test.result }}" != "success" ]; then
            echo "::error::Upgrade test failed"
            exit 1
          fi
          echo "All test jobs passed!"

  lint:
    name: Lint & Style Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Disable problematic Microsoft repositories (known to return 403 on GitHub runners)
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates \
            wget \
            gnupg \
            lsb-release \
            clang-format \
            cppcheck

          # Add PGDG repo for PostgreSQL dev headers
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg

          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-server-dev-${{ env.DEFAULT_PG_VERSION }}

      - name: Run cppcheck
        run: |
          echo "=== Running cppcheck ==="
          cppcheck --enable=all --inconclusive --std=c11 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --error-exitcode=1 \
            pg_background.c || echo "::warning::cppcheck found issues (non-blocking)"

      - name: Check code formatting
        run: |
          echo "=== Checking code formatting ==="
          clang-format --dry-run --Werror pg_background.c 2>&1 || echo "::notice::Code formatting differs from clang-format style (informational)"

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Install PostgreSQL headers
        run: |
          # Disable problematic Microsoft repositories (known to return 403 on GitHub runners)
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates \
            wget \
            gnupg \
            lsb-release \
            libkrb5-dev \
            build-essential

          # Add PGDG repo for PostgreSQL dev headers
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg

          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-server-dev-${{ env.DEFAULT_PG_VERSION }}

      - name: Setup clang/llvm symlinks
        run: |
          for target_ver in 19 18; do
            if [ ! -e "/usr/bin/clang-${target_ver}" ]; then
              sudo ln -sf /usr/bin/clang "/usr/bin/clang-${target_ver}" 2>/dev/null || true
            fi
            if [ ! -d "/usr/lib/llvm-${target_ver}" ]; then
              LLVM_VER=$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -1 | sed 's|.*/llvm-||' || echo "")
              if [ -n "$LLVM_VER" ] && [ -d "/usr/lib/llvm-${LLVM_VER}" ]; then
                sudo mkdir -p "/usr/lib/llvm-${target_ver}/bin"
                if [ -f "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" ]; then
                  sudo ln -sf "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" "/usr/lib/llvm-${target_ver}/bin/llvm-lto" || true
                fi
              fi
            fi
          done

      - name: Build for CodeQL
        run: |
          export PATH=/usr/lib/postgresql/${{ env.DEFAULT_PG_VERSION }}/bin:$PATH
          export PG_CONFIG=/usr/lib/postgresql/${{ env.DEFAULT_PG_VERSION }}/bin/pg_config
          make clean
          make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
