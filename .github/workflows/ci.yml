name: CI - PostgreSQL Extension Build & Test

on:
  push:
    # Branches we want pre-merge CI on. v1.* / v2.* track release-line work;
    # refactor/* is the conventional staging branch for non-feature cleanups.
    # `improvements/*` was historical and is dropped.
    branches: [ master, main, develop, 'v1.*', 'v2.*', 'refactor/*' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Cancel in-progress runs when a new commit is pushed to the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Default PostgreSQL version for lint/security jobs
  DEFAULT_PG_VERSION: "17"

jobs:
  test:
    name: PG ${{ matrix.pg }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        # 19 is PostgreSQL 19 beta (image tag postgres:19beta1; see the
        # Start PostgreSQL container step). Drop the beta mapping at 19 GA.
        pg: [14, 15, 16, 17, 18, 19]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            ~/apt-cache
          key: apt-${{ matrix.os }}-pg${{ matrix.pg }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ matrix.os }}-pg${{ matrix.pg }}-
            apt-${{ matrix.os }}-

      - name: Start PostgreSQL container
        run: |
          set -euo pipefail

          # Start PostgreSQL in a container
          docker run --name postgres-test -d \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_DB=postgres \
            -p 5432:5432 \
            postgres:${{ matrix.pg == 19 && '19beta1' || matrix.pg }}

          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL to start..."
          for i in {1..30}; do
            if docker exec postgres-test pg_isready -U postgres >/dev/null 2>&1; then
              echo "PostgreSQL is ready"
              docker exec postgres-test psql -U postgres -c "SELECT version();"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::PostgreSQL failed to start within 60 seconds"
              exit 1
            fi
            echo "Still waiting... ($i/30)"
            sleep 2
          done

      - name: Install build dependencies
        run: |
          set -euo pipefail

          # Disable problematic Microsoft repositories (known to return 403 on GitHub runners)
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates \
            wget \
            gnupg \
            lsb-release \
            build-essential \
            libkrb5-dev

          # Add PGDG repo
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg

          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update -qq

          # Install client + server-dev headers for the target major
          sudo apt-get install -y -qq \
            postgresql-client-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }}

      - name: Setup clang/llvm symlinks
        run: |
          # Create symlinks for clang/llvm tools to avoid version mismatch errors
          # The PGXS build system may expect specific versions (e.g., clang-19, llvm-19)
          for target_ver in 19 18; do
            if [ ! -e "/usr/bin/clang-${target_ver}" ]; then
              sudo ln -sf /usr/bin/clang "/usr/bin/clang-${target_ver}" 2>/dev/null || true
            fi
            if [ ! -d "/usr/lib/llvm-${target_ver}" ]; then
              # Find the highest llvm version available
              LLVM_VER=$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -1 | sed 's|.*/llvm-||' || echo "")
              if [ -n "$LLVM_VER" ] && [ -d "/usr/lib/llvm-${LLVM_VER}" ]; then
                sudo mkdir -p "/usr/lib/llvm-${target_ver}/bin"
                if [ -f "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" ]; then
                  sudo ln -sf "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" "/usr/lib/llvm-${target_ver}/bin/llvm-lto" || true
                fi
              fi
            fi
          done

      - name: Build extension
        run: |
          set -euo pipefail

          export PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

          echo "=== Build Environment ==="
          $PG_CONFIG --version
          echo "========================="

          make clean
          make

          echo "=== Build artifacts ==="
          ls -la pg_background.so
          ls -la pg_background.control
          echo "======================="

      - name: Copy extension files into container
        run: |
          set -euo pipefail

          # Get PostgreSQL paths from pg_config
          PKGLIBDIR=$(/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config --pkglibdir)
          SHAREDIR=$(/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config --sharedir)

          echo "Container PostgreSQL paths:"
          echo "  PKGLIBDIR: $PKGLIBDIR"
          echo "  SHAREDIR: $SHAREDIR"

          # Copy the shared library
          docker exec postgres-test mkdir -p "$PKGLIBDIR"
          docker cp pg_background.so postgres-test:$PKGLIBDIR/pg_background.so

          # Copy extension control and SQL files
          docker exec postgres-test mkdir -p "$SHAREDIR/extension"
          docker cp pg_background.control postgres-test:$SHAREDIR/extension/

          # Copy all SQL files (base install and upgrade scripts).
          # Files now live under extension/ (current) and extension/legacy/.
          for sqlfile in extension/pg_background--*.sql extension/legacy/pg_background--*.sql; do
            [ -f "$sqlfile" ] || continue
            echo "Copying $sqlfile..."
            docker cp "$sqlfile" postgres-test:$SHAREDIR/extension/
          done

          # Optionally copy bitcode if it was built successfully.
          # PGXS emits one .bc per .o, so files live next to the sources in src/.
          for bcfile in src/pg_background.bc src/pg_background_worker.bc; do
            if [ -f "$bcfile" ]; then
              echo "Copying $bcfile..."
              docker exec postgres-test mkdir -p "$PKGLIBDIR/bitcode/pg_background/src"
              docker cp "$bcfile" postgres-test:$PKGLIBDIR/bitcode/pg_background/src/ \
                || echo "Warning: Failed to copy $bcfile (non-critical)"
            fi
          done

          echo "=== Verify installation in container ==="
          docker exec postgres-test ls -la "$PKGLIBDIR/pg_background.so"
          docker exec postgres-test ls -la "$SHAREDIR/extension/pg_background.control"

      - name: Run regression tests
        run: |
          set -euo pipefail

          export PGHOST=127.0.0.1
          export PGPORT=5432
          export PGUSER=postgres
          export PGPASSWORD=postgres
          export PGDATABASE=postgres
          export PATH="/usr/lib/postgresql/${{ matrix.pg }}/bin:$PATH"

          echo "=== Test Environment ==="
          psql -c "SELECT version();"
          psql -c "CREATE EXTENSION pg_background;"
          psql -c "SELECT * FROM pg_available_extensions WHERE name = 'pg_background';"
          echo "========================"

          # Run regression tests - tests connect to the containerized PostgreSQL
          export PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          make installcheck REGRESS_OPTS+=" --host=$PGHOST --port=$PGPORT --user=$PGUSER"

      - name: Show test results on failure
        if: failure()
        run: |
          echo "=== Regression Diffs ==="
          cat regression.diffs 2>/dev/null || echo "No diffs file"
          echo ""
          echo "=== Regression Out ==="
          cat regression.out 2>/dev/null || echo "No out file"
          echo ""
          echo "=== Container Logs ==="
          docker logs postgres-test 2>&1 | tail -100

      - name: Upload regression diffs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-diffs-pg${{ matrix.pg }}-${{ matrix.os }}
          path: |
            regression.diffs
            regression.out
            results/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker stop postgres-test 2>/dev/null || true
          docker rm postgres-test 2>/dev/null || true

  # Test extension relocatability (custom schema installation) on the full
  # PG matrix — 2.0's relocatable behavior depends on the privilege-helper
  # rename (B4), which we want validated against every supported PG.
  relocatable-test:
    name: Relocatable Test (PG ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # 19 = beta; test-relocatable.sh maps it to postgres:19beta1.
        pg: [14, 15, 16, 17, 18, 19]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run relocatable tests
        run: ./scripts/test-relocatable.sh ${{ matrix.pg }}

  # Test upgrade path 1.8 -> 1.9 -> 1.10 -> 2.0 on the full PG matrix.
  # 2.0 is a major release; an upgrade-script syntax issue specific to one
  # PG major (e.g. removed catalogs, MERGE quirks) must not slip through.
  upgrade-test:
    name: Upgrade Test 1.8→2.0 (PG ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        # No 19: the two-binary harness builds the prior v1.10 binary, which
        # only supports PG 14-18. A fresh 2.0 install on 19 is covered by the
        # main regression + relocatable jobs.
        pg: [14, 15, 16, 17, 18]

    steps:
      # fetch-depth: 0 + tags so the upgrade test can check out the v1.10 tag
      # to build the prior-version (v1-capable) binary. 2.0 dropped the v1 C
      # symbols, so the pre-2.0 install must be done with a pre-2.0 binary.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Run upgrade test
        run: ./scripts/test-upgrade.sh ${{ matrix.pg }}

  # Test under AddressSanitizer + UndefinedBehaviorSanitizer.
  #
  # Builds PostgreSQL from source with -fsanitize=address,undefined and
  # builds the extension with the matching flags so ASan can hook the
  # allocator and stack metadata. Catches the memory-safety class of
  # bugs that the assert-enabled job cannot — heap-use-after-free,
  # stack-buffer-overflow, signed-integer-overflow, NULL-deref. Runs on
  # PG 17 only because the build is expensive (~6 minutes); add more
  # versions if a class of issue is suspected to be PG-major-specific.
  sanitizer-test:
    name: Sanitizer Test (ASan + UBSan, PG 17)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run sanitizer test
        run: ./scripts/test-sanitizer.sh 17

  # Test with assert-enabled PostgreSQL (catches memory context bugs)
  assert-test:
    name: Assert-Enabled Test (PG ${{ matrix.pg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # No 19 yet: test-assert.sh builds from the X.0 GA source tarball,
        # which does not exist during the 19 beta cycle. Add 19 at GA.
        pg: [14, 15, 16, 17, 18]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run assert-enabled test
        run: ./scripts/test-assert.sh ${{ matrix.pg }}

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Test failed - check logs above for assertion failures ==="
          echo "Common assertion: FailedAssertion(\"CurrentMemoryContext != ErrorContext\")"

  # Summary job that depends on all test matrix jobs
  test-summary:
    name: Test Summary
    runs-on: ubuntu-24.04
    needs: [test, relocatable-test, upgrade-test, assert-test, sanitizer-test]
    if: always()
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::Main test matrix failed"
            exit 1
          fi
          if [ "${{ needs.relocatable-test.result }}" != "success" ]; then
            echo "::error::Relocatable test failed"
            exit 1
          fi
          if [ "${{ needs.upgrade-test.result }}" != "success" ]; then
            echo "::error::Upgrade test failed"
            exit 1
          fi
          if [ "${{ needs.assert-test.result }}" != "success" ]; then
            echo "::error::Assert-enabled test failed (memory context bug detected)"
            exit 1
          fi
          if [ "${{ needs.sanitizer-test.result }}" != "success" ]; then
            echo "::error::ASan/UBSan run failed (memory-safety bug detected)"
            exit 1
          fi
          echo "All test jobs passed!"

  lint:
    name: Lint & Style Check
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Disable problematic Microsoft repositories (known to return 403 on GitHub runners)
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates \
            wget \
            gnupg \
            lsb-release \
            clang-format \
            cppcheck

          # Add PGDG repo for PostgreSQL dev headers
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg

          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-server-dev-${{ env.DEFAULT_PG_VERSION }}

      - name: Run cppcheck
        # BLOCKING. Previously the `|| echo "::warning"` swallowed cppcheck
        # exit codes so the job stayed green even when cppcheck found
        # actual issues. With --error-exitcode=1 set, any cppcheck error
        # now fails the lint job and gates merge.
        run: |
          echo "=== Running cppcheck ==="
          cppcheck --enable=all --inconclusive --std=c11 \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=unmatchedSuppression \
            --error-exitcode=1 \
            src/pg_background.c src/pg_background_worker.c

      - name: Check code formatting
        run: |
          echo "=== Checking code formatting ==="
          clang-format --dry-run --Werror src/pg_background.c src/pg_background_worker.c 2>&1 \
            || echo "::notice::Code formatting differs from clang-format style (informational)"

  security:
    name: Security Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp

      - name: Install PostgreSQL headers
        run: |
          # Disable problematic Microsoft repositories (known to return 403 on GitHub runners)
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/azure-cli.list || true

          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            ca-certificates \
            wget \
            gnupg \
            lsb-release \
            libkrb5-dev \
            build-essential

          # Add PGDG repo for PostgreSQL dev headers
          sudo install -d -m 0755 /usr/share/keyrings
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg

          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt \
            $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null

          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-server-dev-${{ env.DEFAULT_PG_VERSION }}

      - name: Setup clang/llvm symlinks
        run: |
          for target_ver in 19 18; do
            if [ ! -e "/usr/bin/clang-${target_ver}" ]; then
              sudo ln -sf /usr/bin/clang "/usr/bin/clang-${target_ver}" 2>/dev/null || true
            fi
            if [ ! -d "/usr/lib/llvm-${target_ver}" ]; then
              LLVM_VER=$(ls -d /usr/lib/llvm-* 2>/dev/null | sort -V | tail -1 | sed 's|.*/llvm-||' || echo "")
              if [ -n "$LLVM_VER" ] && [ -d "/usr/lib/llvm-${LLVM_VER}" ]; then
                sudo mkdir -p "/usr/lib/llvm-${target_ver}/bin"
                if [ -f "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" ]; then
                  sudo ln -sf "/usr/lib/llvm-${LLVM_VER}/bin/llvm-lto" "/usr/lib/llvm-${target_ver}/bin/llvm-lto" || true
                fi
              fi
            fi
          done

      - name: Build for CodeQL
        run: |
          export PATH=/usr/lib/postgresql/${{ env.DEFAULT_PG_VERSION }}/bin:$PATH
          export PG_CONFIG=/usr/lib/postgresql/${{ env.DEFAULT_PG_VERSION }}/bin/pg_config
          make clean
          make

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
